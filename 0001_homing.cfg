[homing_override]
gcode:
    {% set args = rawparams.replace(' ', '')|lower %}
    {% set x = 'x' in args %}
    {% set y = 'y' in args %}
    {% set z = 'z' in args %}

    #Get currently homed axis
    {% set homed_axis = printer.toolhead.homed_axes %}
    
    #TODO: Here should be a z move to +x to move out of the way of the table

    #G28, G28 XYZ
    {% if (x and y and z) or (not rawparams) %}
        G28 Y
        G28 X
        #TODO Clicky call
        #G28 Z
    
    #G28 X
    {% elif x and (not y) and (not z) %}
        {% if 'y' in homed_axis %}
            G90
            G1 Y{ printer.configfile.settings.stepper_y.position_endstop } F{ printer["gcode_macro _GLOBAL_VARIABLES"].homing_speed_xy }
            G28 X
        {% else %}
            G28 Y
            G28 X
        {% endif %}

    #G28 Y
    {% elif (not x) and y and (not z) %}
        G28 Y

    #G28 Z
    {% elif (not x) and (not y) and z %}
        {% if 'y' not in homed_axis %}
            G28 Y
        {% endif %}
        {% if 'x' not in homed_axis %}
            G28 X
        {% endif %}
        #TODO Clicky call
        #G28 Z

    #G28  XY
    {% elif x and y and (not z) %}
        G28 Y
        G28 X

    #G28 XZ
    {% elif x and (not y) and z %}
        {% if 'y' in homed_axis %}
            G90
            G1 Y{ printer.configfile.settings.stepper_y.position_endstop } F{ printer["gcode_macro _GLOBAL_VARIABLES"].homing_speed_xy }
            G28 X
        {% else %}
            G28 Y
            G28 X
        {% endif %}
        #TODO Clicky call
        #G28 Z

    #G28 YZ
    {% elif (not x) and y and z %}
        G28 Y
        #TODO Clicky call
        #G28 Z

    {% else %}
        RESPOND MSG="Where we are going we won't need axis to home"

    {% endif %}



[gcode_macro _homing_phase_I]
gcode:
    RESPOND MSG="Test"

#[gcode_macro _home_z]

[gcode_macro homed_status]
gcode:
    RESPOND MSG={printer.toolhead.homed_axes}
    RESPOND MSG=F{ printer["gcode_macro _GLOBAL_VARIABLES"].klicky_attach_speed }