[homing_override]
gcode:
    {% set args = rawparams.replace(' ', '')|lower %}
    {% set x = 'x' in args %}
    {% set y = 'y' in args %}
    {% set z = 'z' in args %}

    #Get currently homed axis
    {% set homed_axis = printer.toolhead.homed_axes %}
    
    G90
    SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
    G1 Z{ printer["gcode_macro _GLOBAL_VARIABLES"].klicky_z_clearance } F{ printer["gcode_macro _GLOBAL_VARIABLES"].homing_speed_z }
    SET_KINEMATIC_POSITION CLEAR_HOMED=Z

    #G28, G28 XYZ
    {% if (x and y and z) or (not rawparams) %}
        G28 Y
        G28 X
        _home_z
    
    #G28 X
    {% elif x and (not y) and (not z) %}
        {% if 'y' in homed_axis %}
            G90
            G1 Y{ printer.configfile.settings.stepper_y.position_endstop } F{ printer["gcode_macro _GLOBAL_VARIABLES"].homing_speed_xy }
            G28 X
        {% else %}
            G28 Y
            G28 X
        {% endif %}

    #G28 Y
    {% elif (not x) and y and (not z) %}
        G28 Y

    #G28 Z
    {% elif (not x) and (not y) and z %}
        {% if 'y' not in homed_axis %}
            G28 Y
        {% endif %}
        {% if 'x' not in homed_axis %}
            G28 X
        {% endif %}
        _home_z

    #G28  XY
    {% elif x and y and (not z) %}
        G28 Y
        G28 X

    #G28 XZ
    {% elif x and (not y) and z %}
        {% if 'y' in homed_axis %}
            G90
            G1 Y{ printer.configfile.settings.stepper_y.position_endstop } F{ printer["gcode_macro _GLOBAL_VARIABLES"].homing_speed_xy }
            G28 X
        {% else %}
            G28 Y
            G28 X
        {% endif %}
        _home_z

    #G28 YZ
    {% elif (not x) and y and z %}
        G28 Y
        _home_z

    {% else %}
        RESPOND MSG="Where we are going we won't need axis to home"

    {% endif %}

[gcode_macro _home_z]
gcode:
    ATTACH_PROBE
    G90
    G1 X{ printer.configfile.settings.stepper_x.position_max / 2 } Y{ printer.configfile.settings.stepper_y.position_max / 2 } F{ printer["gcode_macro _GLOBAL_VARIABLES"].homing_speed_xy }
    G28 Z
    G1 Z{ printer["gcode_macro _GLOBAL_VARIABLES"].klicky_z_clearance } F{ printer["gcode_macro _GLOBAL_VARIABLES"].homing_speed_z }
    DETACH_PROBE

[gcode_macro homed_status]
gcode:
    RESPOND MSG={printer.toolhead.homed_axes}