# This file contains variables to be used in operation, as well as printer-specific defaults.
#Base kinematic parameters
[printer]
max_velocity: 5000
max_z_velocity: 25
max_accel: 20000
minimum_cruise_ratio: 0.1
square_corner_velocity: 15

[input_shaper]
shaper_freq_x: 64
shaper_freq_y: 64.1

[probe]
x_offset: -15
y_offset: 5
z_offset: 10.2
speed: 15

[bed_mesh]
speed: 250
horizontal_move_z: 10
mesh_min: 3, 5
mesh_max: 103, 105
probe_count: 5, 5

[stepper_x]
position_endstop: 118.6
position_min: 0
position_max: 118.6
homing_speed: 100
homing_retract_speed: 10

[stepper_y]
position_endstop: 117.5
position_min: 0
position_max: 117.5
homing_speed: 100
homing_retract_speed: 10

[stepper_z]
position_min: -5
position_max: 117
homing_speed: 15
homing_retract_speed: 5

#Stores values for other macros, all values from slicer get transferred to here
[gcode_macro _GLOBAL_VARIABLES]
###############################################################################
#                            Current print parameters                         #
###############################################################################
variable_extruder_temp:0
variable_bed_temp:0
variable_chamber_temp:0
variable_pa:0
variable_z_offset:0
###############################################################################
#                            Printer parameters                               #
###############################################################################
variable_pwm_soaked_extruder:0
variable_pwm_soaked_bed:0
###############################################################################
#                            Kinematic parameters                             #
###############################################################################
variable_soak_position_x:0
variable_soak_position_y:0
variable_soak_position_z:0
#variable_endstop_position_z_x:0
#variable_endstop_position_z_y:0
variable_homing_speed_z:0
variable_homing_speed_xy:0
###############################################################################
#                           Klicky parameters                                 #
###############################################################################
variable_klicky_position_x:0
variable_klicky_position_y:0
variable_klicky_z_clearance:0
variable_klicky_attach_speed:0
###############################################################################
gcode:
	RESPOND MSG="SANYOCHEK MOMENT"

[delayed_gcode _INIT_GLOBAL_VARIABLES]
gcode:
	###############################################################################
	#                            Current print parameters                         #
	###############################################################################
	SET_GCODE_VARIABLE MACRO=_GLOBAL_VARIABLES VARIABLE=extruder_temp VALUE={ 250|float }
	SET_GCODE_VARIABLE MACRO=_GLOBAL_VARIABLES VARIABLE=bed_temp VALUE={ 100|float }
	SET_GCODE_VARIABLE MACRO=_GLOBAL_VARIABLES VARIABLE=chamber_temp VALUE={ 0|float }
	SET_GCODE_VARIABLE MACRO=_GLOBAL_VARIABLES VARIABLE=pa VALUE={ 0.0475|float }
	SET_GCODE_VARIABLE MACRO=_GLOBAL_VARIABLES VARIABLE=z_offset VALUE={ 0|float }
	###############################################################################
	#                            Printer parameters                               #
	###############################################################################
	SET_GCODE_VARIABLE MACRO=_GLOBAL_VARIABLES VARIABLE=pwm_soaked_extruder VALUE={ 0.8|float }
	SET_GCODE_VARIABLE MACRO=_GLOBAL_VARIABLES VARIABLE=pwm_soaked_bed VALUE={ 0.8|float }
	###############################################################################
	#                            Kinematic parameters                             #
	###############################################################################
	SET_GCODE_VARIABLE MACRO=_GLOBAL_VARIABLES VARIABLE=soak_position_x VALUE={ printer.configfile.settings.stepper_x.position_max / 2|float }
	SET_GCODE_VARIABLE MACRO=_GLOBAL_VARIABLES VARIABLE=soak_position_y VALUE={ printer.configfile.settings.stepper_y.position_max / 2|float }
	SET_GCODE_VARIABLE MACRO=_GLOBAL_VARIABLES VARIABLE=soak_position_z VALUE={ 50|float }
	SET_GCODE_VARIABLE MACRO=_GLOBAL_VARIABLES VARIABLE=homing_speed_z VALUE={ printer.configfile.settings.stepper_z.homing_speed|int * 60}
	SET_GCODE_VARIABLE MACRO=_GLOBAL_VARIABLES VARIABLE=homing_speed_xy VALUE={ printer.configfile.settings.stepper_x.homing_speed|int * 60}
	###############################################################################
	#                           Klicky parameters                                 #
	###############################################################################
	SET_GCODE_VARIABLE MACRO=_GLOBAL_VARIABLES VARIABLE=klicky_position_x VALUE={ printer.configfile.settings.stepper_x.position_min|float }
	SET_GCODE_VARIABLE MACRO=_GLOBAL_VARIABLES VARIABLE=klicky_position_y VALUE={ printer.configfile.settings.stepper_y.position_max|float }
	SET_GCODE_VARIABLE MACRO=_GLOBAL_VARIABLES VARIABLE=klicky_z_clearance VALUE={ 15|float }
	SET_GCODE_VARIABLE MACRO=_GLOBAL_VARIABLES VARIABLE=klicky_attach_speed VALUE={ 250|int * 60}
	###############################################################################
	RESPOND MSG="variables initialized"
initial_duration: 1
