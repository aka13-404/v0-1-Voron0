### Macro set to attach probe (SERVO WHEN?!)
#Initial probe query
[gcode_macro ATTACH_PROBE]
gcode:
	# check if probe is already attached. Due to klipper limitations, this has to happen in separate macros.
    RESPOND MSG="Attaching probe"
	QUERY_PROBE
	_ATTACH_PROBE_PHASE_I

#Actual docking
[gcode_macro _ATTACH_PROBE_PHASE_I]
gcode:
	{% if printer.probe.last_query %} #if probe reports triggered, it is not attached - don't attach probe if it is attached
		{% if 'xy' not in printer.toolhead.homed_axes %}  #home if not homed
			G28 X Y #No z since we are attaching probe
		{% endif %}
		G90
        #Move bed out of the way just in case
        {% if 'z' not in printer.toolhead.homed_axes %}
            #If Z is not homed, still need to move the table for some safe margin down just in case. 
            SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
            G1 Z{ printer["gcode_macro _GLOBAL_VARIABLES"].klicky_z_clearance } F{ printer["gcode_macro _GLOBAL_VARIABLES"].homing_speed_z }
            SET_KINEMATIC_POSITION CLEAR_HOMED=Z
            #After this move we still do not consider Z homed (obviously)
        {% else %}
            #Z was homed (miraculously) (probe was detached for whatever reason, but we still want to re-home, as example)
			{% if printer.toolhead.position.z < printer["gcode_macro _GLOBAL_VARIABLES"].klicky_z_clearance %}
				G1 Z{ printer["gcode_macro _GLOBAL_VARIABLES"].klicky_z_clearance } F{ printer["gcode_macro _GLOBAL_VARIABLES"].homing_speed_z }
			{% endif %}
        {% endif %}

        #Attaching probe
		G1 X{ printer["gcode_macro _GLOBAL_VARIABLES"].klicky_position_x } F{ printer["gcode_macro _GLOBAL_VARIABLES"].klicky_attach_speed }
		G1 Y{ printer["gcode_macro _GLOBAL_VARIABLES"].klicky_position_y } F{ printer["gcode_macro _GLOBAL_VARIABLES"].klicky_attach_speed }

        G1 X{ printer["gcode_macro _GLOBAL_VARIABLES"].klicky_position_x + 25} F{ printer["gcode_macro _GLOBAL_VARIABLES"].klicky_attach_speed }
		G1 Y{ printer["gcode_macro _GLOBAL_VARIABLES"].klicky_position_y - 25 } F{ printer["gcode_macro _GLOBAL_VARIABLES"].klicky_attach_speed } #return with attached probe
		QUERY_PROBE #check if probe is attached.  Due to klipper limitations, this has to happen in separate macros.
		_ATTACH_PROBE_PHASE_II
	{% else %}
		RESPOND MSG="Probe already attached"
	{% endif %}

#Final probe query
[gcode_macro _ATTACH_PROBE_PHASE_II]
gcode:
    {% if printer.probe.last_query %}
		RESPOND PREFIX=tgalarm MSG="Probe attach unsuccessfull, check printer"
        #Assuming this happens on an unsupervised print start, should trigger an emergency accordingly
        #M112
	{% endif %}

### Macro set to dettach probe (SERVO WHEN?!)
#Initial probe query
[gcode_macro DETACH_PROBE]
gcode:
	# check if probe is already detached. Due to klipper limitations, this has to happen in separate macros.
    RESPOND MSG="Detaching probe"
	QUERY_PROBE
	_DETACH_PROBE_PHASE_I

#Actual docking
[gcode_macro _DETACH_PROBE_PHASE_I]
gcode:
	{% if not printer.probe.last_query %} #if probe reports triggered, it is not attached - don't attach probe if it is attached
		{% if 'xy' not in printer.toolhead.homed_axes %}  #home if not homed
			#Due to current limits moving with probe to X endstop will forcefully detach it. Have fun detaching when not homed.
			#(Servo when)?
			G28 X Y
		{% endif %}
		G90
        #Move bed out of the way just in case
        {% if 'z' not in printer.toolhead.homed_axes %}
            SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
            G1 Z{ printer["gcode_macro _GLOBAL_VARIABLES"].klicky_z_clearance } F{ printer["gcode_macro _GLOBAL_VARIABLES"].homing_speed_z }
            SET_KINEMATIC_POSITION CLEAR_HOMED=Z
            #After this move we still do not consider Z homed (obviously)
        {% else %}
            #Z was homed
			{% if printer.toolhead.position.z < printer["gcode_macro _GLOBAL_VARIABLES"].klicky_z_clearance %}
            	G1 Z{ printer["gcode_macro _GLOBAL_VARIABLES"].klicky_z_clearance } F{ printer["gcode_macro _GLOBAL_VARIABLES"].homing_speed_z }
			{% endif %}
        {% endif %}

        #Detaching probe
		G1 X{ printer["gcode_macro _GLOBAL_VARIABLES"].klicky_position_x + 25} F{ printer["gcode_macro _GLOBAL_VARIABLES"].klicky_attach_speed }
		G1 Y{ printer["gcode_macro _GLOBAL_VARIABLES"].klicky_position_y } F{ printer["gcode_macro _GLOBAL_VARIABLES"].klicky_attach_speed }
		G1 X{ printer["gcode_macro _GLOBAL_VARIABLES"].klicky_position_x } F{ printer["gcode_macro _GLOBAL_VARIABLES"].klicky_attach_speed }
		
		G1 Y{ printer["gcode_macro _GLOBAL_VARIABLES"].klicky_position_y - 25 } F{ printer["gcode_macro _GLOBAL_VARIABLES"].klicky_attach_speed } #return with detached probe
		G1 X{ printer["gcode_macro _GLOBAL_VARIABLES"].klicky_position_x + 25} F{ printer["gcode_macro _GLOBAL_VARIABLES"].klicky_attach_speed }
	
		QUERY_PROBE #check if probe is detached  Due to klipper limitations, this has to happen in separate macros.
		_DETACH_PROBE_PHASE_II
	{% else %}
		RESPOND MSG="Probe already detached"
	{% endif %}

#Final probe query
[gcode_macro _DETACH_PROBE_PHASE_II]
gcode:
    {% if not printer.probe.last_query %}
		RESPOND PREFIX=tgalarm MSG="Probe detach unsuccessfull, check printer"
        #Assuming this happens on an unsupervised print start, should trigger an emergency accordingly
        #M112
	{% endif %}

[gcode_macro homed_status]
gcode:
    RESPOND MSG={ printer.toolhead.homed_axes }

[gcode_macro position]
gcode:
	RESPOND MSG={ printer.toolhead.position.z }